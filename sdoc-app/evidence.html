<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidence preview · SDOC</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #1c1c1c; background: #f6f6f4; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 14px 18px; background: white; border-bottom: 1px solid #e6e6e2; }
    h1 { margin: 0; font-size: 16px; } p { margin: 4px 0 0; color: #666663; font-size: 13px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    a, button { min-height: 32px; padding: 0 11px; border: 1px solid #cfcfca; border-radius: 6px; color: #1c1c1c; background: white; font-weight: 700; text-decoration: none; cursor: pointer; }
    a:focus-visible, button:focus-visible { outline: 3px solid #d8741a; outline-offset: 2px; }
    button[aria-pressed="false"] { background: #efefec; color: #3d3d3d; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; padding: 14px; height: calc(100vh - 63px); box-sizing: border-box; }
    .viewer { background: #5a5a57; border-radius: 10px; overflow: auto; padding: 14px; }
    /* The wrapper shrinks to the rendered page, so a box sized as a share of
       the wrapper is a share of the page itself, at any display width. */
    .page-wrap { position: relative; margin: 0 auto; background: white; box-shadow: 0 2px 12px #0000002e; }
    .page-wrap img { display: block; width: 100%; }
    .overlay { position: absolute; border: 3px solid #e8892a; background: rgba(232, 137, 42, .16); pointer-events: none; display: none; }
    .viewer-note { margin: 0; padding: 26px; color: #f6f6f4; font-size: 13px; line-height: 1.6; text-align: center; }
    aside { background: white; border: 1px solid #e6e6e2; border-radius: 10px; padding: 16px; overflow: auto; }
    dl { margin: 0; display: grid; gap: 12px; } dt { color: #666663; font-size: 12px; } dd { margin: 3px 0 0; font-size: 13px; overflow-wrap: anywhere; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; height: auto; } .viewer { max-height: 70vh; } }
  </style>
</head>
<body>
  <header>
    <div><h1 id="title">Evidence preview</h1><p id="subtitle">Original file with source overlay</p></div>
    <div class="actions">
      <button id="toggle" type="button" aria-pressed="true">Hide overlay</button>
      <a id="open" target="_blank" rel="noreferrer">Open original</a>
      <a id="download">Download</a>
    </div>
  </header>
  <main>
    <section class="viewer" id="viewer" aria-label="Document page"></section>
    <aside><dl id="facts"></dl></aside>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const path = params.get('path') || '';
    const pageParam = params.get('page');
    const page = pageParam || '1';
    const bbox = (params.get('bbox') || '').split(',').map(Number);
    const text = params.get('text') || '';
    const field = params.get('field') || 'Evidence';
    const side = params.get('side') || '';
    const where = params.get('where') || '';
    const isPdf = /\.pdf$/i.test(path);
    const hasBox = bbox.length === 4 && bbox.every(n => !Number.isNaN(n));

    const viewer = document.getElementById('viewer');
    const toggle = document.getElementById('toggle');
    document.getElementById('download').href = `/api/attachments/download?path=${encodeURIComponent(path)}`;
    document.getElementById('open').href = `/api/attachments/preview?path=${encodeURIComponent(path)}`;
    document.getElementById('title').textContent = `${field}${side ? ' · ' + side : ''}`;
    document.getElementById('subtitle').textContent = path.split('/').pop() || 'Original document';

    let box = null;
    let visible = true;

    function note(message) {
      const paragraph = document.createElement('p');
      paragraph.className = 'viewer-note';
      paragraph.textContent = message;
      viewer.replaceChildren(paragraph);
    }

    function draw(pageWidth, pageHeight) {
      if (!box) return;
      if (!visible) { box.style.display = 'none'; return; }
      // bbox is [x0, top, x1, bottom] in PDF points with a top-left origin --
      // the same space the page image was rendered from, so the share of the
      // page is exact rather than approximate.
      const pct = n => `${Math.max(0, Math.min(100, n * 100))}%`;
      box.style.display = 'block';
      box.style.left = pct(bbox[0] / pageWidth);
      box.style.top = pct(bbox[1] / pageHeight);
      box.style.width = pct((bbox[2] - bbox[0]) / pageWidth);
      box.style.height = pct((bbox[3] - bbox[1]) / pageHeight);
    }

    function renderFacts(overlayState) {
      const rows = [
        ['Document', path],
        ['Location', where || (pageParam ? `Page ${page}` : 'Not recorded for this document type')],
        ['Source text', text || 'No source snippet stored for this field.'],
        ['Bounding box', hasBox ? `[${bbox.join(', ')}] pt` : 'Not available for this document type'],
        ['Overlay', overlayState],
      ];
      document.getElementById('facts').replaceChildren(...rows.map(([key, value]) => {
        const wrap = document.createElement('div');
        const dt = document.createElement('dt');
        const dd = document.createElement('dd');
        dt.textContent = key;
        dd.textContent = value;
        wrap.append(dt, dd);
        return wrap;
      }));
    }

    function unavailable(message, overlayState) {
      note(message);
      renderFacts(overlayState);
      toggle.disabled = true;
    }

    async function load() {
      if (!isPdf) {
        unavailable(
          'This document is not a PDF, so its page cannot be shown here. Use the source text on the right, or open the original.',
          'Unavailable for this document type');
        return;
      }
      note('Loading page…');
      let response;
      try {
        response = await fetch(`/api/attachments/page?path=${encodeURIComponent(path)}&page=${encodeURIComponent(page)}`);
      } catch (error) {
        response = null;
      }
      if (!response || !response.ok) {
        unavailable(
          'The page image could not be rendered. Open the original document and use the source text on the right.',
          'Unavailable; the page could not be rendered');
        return;
      }
      const pageWidth = Number(response.headers.get('X-Page-Width'));
      const pageHeight = Number(response.headers.get('X-Page-Height'));
      const image = document.createElement('img');
      image.src = URL.createObjectURL(await response.blob());
      image.alt = `Page ${page} of ${path.split('/').pop() || 'the document'}`;
      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      wrap.append(image);
      const canPlace = hasBox && pageWidth > 0 && pageHeight > 0;
      if (canPlace) {
        box = document.createElement('div');
        box.className = 'overlay';
        wrap.append(box);
      } else {
        toggle.disabled = true;
      }
      viewer.replaceChildren(wrap);
      draw(pageWidth, pageHeight);
      renderFacts(canPlace
        ? 'Placed from the stored bounding box on the rendered page'
        : 'No bounding box stored for this field');
      toggle.addEventListener('click', () => {
        visible = !visible;
        toggle.textContent = visible ? 'Hide overlay' : 'Show overlay';
        toggle.setAttribute('aria-pressed', String(visible));
        draw(pageWidth, pageHeight);
      });
    }

    load();
  </script>
</body>
</html>
